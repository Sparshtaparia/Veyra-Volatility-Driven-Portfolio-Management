# Alembic configuration file
# This file is read by alembic commands

[alembic]
# Path to migration scripts (relative to this file's location)
script_location = migrations

# Template for generating migration filenames
file_template = %%(rev)s_%%(slug)s

# Timezone for %%(year)d etc. tokens in file_template
# Leave blank for local time, or specify UTC
# timezone =

# Max length of characters to apply to the slug field
# truncate_slug_length = 40

# Set to 'true' to run the environment during autogenerate
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source
# sourceless = false

# Version location specification; this defaults
# to migrations/versions.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/migrations/versions

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# Database URL is read from environment variable via env.py
# Do NOT put credentials here — use .env
sqlalchemy.url = placeholder_overridden_by_env_py

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the target file
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
