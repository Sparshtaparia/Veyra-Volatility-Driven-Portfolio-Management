[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "veyra"
version = "0.1.0"
description = "Veyra — Volatility-Driven Portfolio Management"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web framework
    "fastapi>=0.111.0,<0.113.0",
    "uvicorn[standard]>=0.30.0,<0.32.0",

    # Data validation
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",

    # Database
    "sqlalchemy>=2.0.30,<2.1.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.0,<2.0.0",

    # Authentication
    "PyJWT[crypto]>=2.8.0,<3.0.0",

    # Quantitative (declared for future phases, not imported in Phase 1)
    # arch 6.x wheels use the NumPy 1.x ABI.
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scipy>=1.13.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "arch>=6.3.0,<7.0.0",
    "cvxpy>=1.5.0,<1.6.0",
    "yfinance>=0.2.0,<1.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "apscheduler>=3.10.4,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "httpx>=0.27.0,<0.28.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "ruff>=0.4.0,<0.5.0",
    "mypy>=1.10.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test configuration must establish environment variables before importing the app.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
