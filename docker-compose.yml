services:
  postgres:
    image: postgres:15-alpine
    container_name: veyra-postgres
    environment:
      POSTGRES_DB: veyra
      POSTGRES_USER: veyra
      POSTGRES_PASSWORD: veyra
    ports:
      - "5432:5432"
    volumes:
      - veyra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veyra -d veyra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  veyra_postgres_data:
    driver: local
